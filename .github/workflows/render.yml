name: 生成看板图片

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      # 私密订阅链接放在仓库的 Secrets 里
      TODO_ICS_URL: ${{ secrets.TODO_ICS_URL }}
      CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装中文字体和图片工具
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk imagemagick

      - name: 安装依赖
        run: npm install

      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      - name: 生成图片
        run: node dashboard/render.mjs

      # 横屏版：把图旋转 90 度再上传，Kindle 横放（顶部朝左）才显示正确
      - name: 旋转图片（横屏）
        run: convert out/dashboard.png -rotate 90 out/dashboard.png

      - name: 提交回仓库
        run: |
          git config user.name "kindle-bot"
          git config user.email "bot@local"
          git add out/dashboard.png dashboard/weather-cache.json
          git commit -m "render $(date -u +%Y-%m-%dT%H:%MZ)" || echo "没有变化"
          git push
